[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "naotav-metricceil"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对评测指标的饱和相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "naotav" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://naotav.github.io"
Repository = "https://github.com/naotav/metricceil"
Issues = "https://github.com/naotav/metricceil/issues"

[project.scripts]
metricceil = "metricceil:main"

[tool.setuptools]
py-modules = ["metricceil"]
